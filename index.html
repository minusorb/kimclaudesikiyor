<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07040d">
<title>&#8203;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cold:#07040d; --s1:#0e0816; --s2:#160d21; --line:rgba(244,237,230,.08); --line2:rgba(244,237,230,.14);
  --ink:#f4ede6; --dim:#b3a6b7; --faint:#7d6f83;
  --t0:#1a0b2e; --t1:#3d0f63; --t2:#76197e; --t3:#b8326e; --t4:#ec5e3c; --t5:#f9a03b; --t6:#fde9a6;
  --display:"Host Grotesk", "Segoe UI", sans-serif;
  --body:"Host Grotesk", "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink)}
body{font:400 15px/1.5 var(--body);min-height:100dvh;-webkit-font-smoothing:antialiased}
body.on{background:var(--cold)}
::selection{background:var(--t3);color:var(--ink)}
:focus-visible{outline:2px solid var(--t5);outline-offset:3px;border-radius:4px}
#app{display:none}
body.on #app{display:block}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:clamp(28px,5vw,56px) 0 clamp(20px,3vw,32px);border-bottom:1px solid var(--line)}
.mark{font:500 clamp(34px,5.2vw,68px)/1 var(--display);letter-spacing:-.01em;margin:0}
.mark .hot{color:var(--t5)}
.lede{max-width:34ch;color:var(--dim);margin:14px 0 0;font-size:16px}
.live{text-align:right;color:var(--dim);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums;white-space:nowrap}
.live b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t5);margin-right:8px;vertical-align:1px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:20px 0 4px}
.tabs{gap:0;padding:20px 0 4px}
.tabs{position:relative}
.tabs button{font:500 14px/1 var(--body);color:var(--dim);background:transparent;border:0;padding:12px 14px;min-height:44px;cursor:pointer;transition:color .2s}
.tabs .ind{position:absolute;left:0;bottom:4px;height:2px;width:0;background:var(--t5)}
.tabs .ind.go{transition:transform .42s cubic-bezier(.22,1,.36,1),width .42s cubic-bezier(.22,1,.36,1)}
#plot circle:not([data-n]){transition:opacity .3s}
#plot.morph circle:not([data-n]){opacity:0}
#plot.morph text{animation:axin .45s ease-out both}
@keyframes axin{from{opacity:0}}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.board{margin-top:8px}
.head,.row{display:grid;grid-template-columns:40px minmax(180px,1.15fr) minmax(330px,2.4fr) 132px 120px 148px;gap:0 24px;align-items:center}
.head{padding:18px 0 10px;color:var(--faint);font-size:13px;border-bottom:1px solid var(--line)}
.head span:nth-child(n+4){text-align:right}
.row{padding:18px 0;border-bottom:1px solid var(--line);position:relative}
.rank{align-self:stretch}
.name .rk{position:absolute;left:-64px;top:0;font:inherit;color:var(--faint);font-variant-numeric:tabular-nums}

.who{min-width:0}
.name{position:relative;font:500 20px/1.2 var(--display);overflow-wrap:anywhere}

.host{color:var(--dim);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.host .model{color:var(--ink)}
.heat{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:center}
.heat .dl{font-size:11px;color:var(--faint);text-align:right;line-height:1}
.cells{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.cells i{display:block;height:clamp(9px,1.05vw,15px);border-radius:2px;background:var(--t0)}
.cells i:hover{outline:1px solid var(--ink);outline-offset:1px}
.cal{display:grid;grid-template-columns:28px auto;gap:4px 8px;justify-content:start}
.cal .ml{grid-column:2;display:grid;gap:3px;font-size:10px;color:var(--faint);height:12px;white-space:nowrap}
.cal .dls{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--faint);text-align:right;line-height:1;align-items:center}
.weeks{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px}
.weeks i{display:block;aspect-ratio:1;border-radius:2px;background:var(--t0)}
.weeks i.x{background:none;pointer-events:none}
.weeks i:not(.x):hover{outline:1px solid var(--ink);outline-offset:1px}
.hours{grid-column:2;display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font:500 28px/1 var(--display);letter-spacing:-.01em}
.row.first .n7 .big{color:var(--t5)}
.sub .lim{color:var(--ink);font-weight:500}
.sub{color:var(--dim);font-size:13px;margin-top:5px;font-variant-numeric:normal}
.meters{display:grid;gap:10px}
.meter .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.meter .lab b{color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;border-radius:3px;background:var(--dim);transform-origin:left;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.meter.hi .bar span{background:var(--t4)}
.meter.none .lab b{color:var(--faint);font-weight:400}
.acct{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:12px 32px;align-items:end;padding:20px 0;border-bottom:1px solid var(--line)}
.acct h2{margin:0;font:500 15px/1.3 var(--body);color:var(--ink)}
.acct h2 span{display:block;color:var(--faint);font-weight:400;font-size:13px}
.models{display:grid;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.models div{display:grid;grid-template-columns:1fr auto;gap:8px;color:var(--dim)}
.models div b{color:var(--ink);font-weight:500}
.models .mbar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--s2);overflow:hidden}
.models .mbar i{display:block;height:100%;background:var(--dim);transform-origin:left}
.models div:first-child .mbar i{background:var(--t4)}
.models .none{color:var(--faint)}
.reset{font-size:12px;color:var(--faint);margin-top:4px;min-height:1em}

section.chart{padding:clamp(40px,6vw,72px) 0 8px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.ch h2{font:500 clamp(22px,2.4vw,30px)/1.1 var(--display);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.plot{margin-top:20px;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--s2);border:1px solid var(--line2);color:var(--ink);font-size:13px;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:9;font-variant-numeric:tabular-nums}
.tip.show{opacity:1;transform:none}
.tip span{color:var(--dim)}

.totals{border-top:1px solid var(--line);margin-top:clamp(40px,6vw,64px);padding:24px 0 clamp(72px,10vw,120px);font:400 clamp(18px,1.8vw,22px)/1.45 var(--display);color:var(--dim);max-width:44ch}
.totals b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:13px;padding:22px 0 40px}
footer code{font-family:inherit;color:var(--dim)}
.empty,.err{padding:56px 0;color:var(--dim);max-width:52ch}
.empty h3,.err h3{font:600 24px/1.2 var(--display);color:var(--ink);margin:0 0 8px}

@media (max-width:1100px){
  .acct{grid-template-columns:1fr 1fr}
  .acct h2{grid-column:1/-1}
  .head{display:none}
  .row{grid-template-columns:34px 1fr auto;grid-template-areas:"r w n" "h h h" "m m c";gap:14px 16px}
  .name .rk{left:-50px}
  .rank{grid-area:r}.who{grid-area:w}.heat,.cal{grid-area:h}.n7{grid-area:n}.usd{grid-area:c;align-self:end}.models{grid-area:m}
}
@media (max-width:560px){
  header.top{flex-direction:column;align-items:flex-start}
  .live{text-align:left}
  .row{grid-template-areas:"r w w" "r n n" "h h h" "m m m" "c c c"}
  .n7,.usd{text-align:left}
  .acct{grid-template-columns:1fr}
  .totals{grid-template-columns:1fr}
  .totals div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .heat{grid-template-columns:22px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header class="top">
      <div>
        <h1 class="mark">kim claude <span class="hot">sikiyor</span></h1>
        <p class="lede">Kimin ne kadar Claude kullandığı. Rakamlar her bilgisayardan 10 dakikada bir geliyor, sayım kurulumla başlıyor.</p>
      </div>
      <div class="live" id="live"></div>
    </header>
    <section class="acct" id="acct" hidden></section>
    <nav class="tabs" id="tabs" aria-label="Dönem"></nav>
    <div class="board" id="board"></div>
    <section class="chart" id="chart" hidden>
      <div class="ch"><h2 id="chartTitle">Son 14 gün</h2><div class="legend" id="legend"></div></div>
      <div class="plot" id="plot"></div>
    </section>
    <div class="totals" id="totals" hidden></div>

  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const REPO = 'minusorb/kimclaudesikiyor', ISSUE = 1;
const $ = (s) => document.querySelector(s);
const DAYS = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const HEADS = {today:'Bugün, saat saat', yday:'Dün, saat saat', w1:'Son 7 gün, saat saat', w2:'Son 14 gün, gün gün', w3:'Son 21 gün, gün gün', m1:'Son 30 gün, gün gün', all:'Tüm zaman, gün gün'};
const COLORS = ['#f9a03b','#4fb8ff','#b98cff','#5fd38a','#ff6f91','#ffd84d','#3fd0c9','#ff8a5c'];
const BANDS = [[2,'#ffffff'],[5,'#b9f3c4'],[10,'#2fc45c'],[20,'#f5e03a'],[30,'#ff9a1f'],[40,'#f2522a'],[Infinity,'#d6141a']];
const PERIODS = [['today','bugün'],['yday','dün'],['w1','1 hafta'],['w2','2 hafta'],['w3','3 hafta'],['m1','1 ay'],['all','toplam']];
let PERIOD = (() => { try { return localStorage.getItem('kcs-p') || 'w1'; } catch { return 'w1'; } })();
const LINE = ['#fde9a6','#ec5e3c','#b8326e','#f9a03b','#9b5de5','#e8d5ff','#ff8fab','#7ae0c3'];

function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function keyText(){
  const h = new URLSearchParams(location.hash.slice(1)).get('k');
  if (h) { try{localStorage.setItem('kcs-k',h)}catch{} history.replaceState(null,'',location.pathname); return h; }
  try{return localStorage.getItem('kcs-k')}catch{return null}
}
async function unseal(key, blob){
  const raw = Uint8Array.from(atob(blob), c => c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
const fmt = (n) => n >= 1e9 ? (n/1e9).toFixed(n>=1e10?0:1)+'B' : n >= 1e6 ? (n/1e6).toFixed(n>=1e8?0:1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(n);
const usd = (n) => '$' + (n >= 1000 ? Math.round(n).toLocaleString('en-US') : n >= 10 ? Math.round(n) : n.toFixed(2));
function ago(t){
  const s = Math.max(0,(Date.now()-t)/1000);
  if (s < 90) return 'az önce';
  if (s < 3600) return Math.round(s/60)+' dk önce';
  if (s < 86400) return Math.round(s/3600)+' sa önce';
  return Math.round(s/86400)+' gün önce';
}
function until(iso){
  const ms = Date.parse(iso) - Date.now();
  if (!(ms > 0)) return '';
  const h = Math.floor(ms/36e5), m = Math.round((ms%36e5)/6e4);
  return h >= 24 ? Math.round(h/24)+' günde sıfırlanır' : (h ? h+' sa ' : '')+m+' dk sonra sıfırlanır';
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function heatColor(v, max){
  if (!v) return 'var(--t0)';
  const p = v / max * 50;
  if (p < 40) return BANDS.find(b => p < b[0])[1];
  const f = Math.min(1, (p - 40) / 20), mix = (x, y) => Math.round(x + (y - x) * f);
  return `rgb(${mix(214, 142)},${mix(20, 36)},${mix(26, 201)})`;
}
function meter(label, w, stale){
  const hi = w && typeof w.p === 'number' && w.p >= 80;
  if (!w || typeof w.p !== 'number') return `<div class="meter none"><div class="lab"><span>${label}</span><b>okunamadı</b></div><div class="bar"></div></div>`;
  const p = Math.max(0, Math.min(100, w.p));
  return `<div class="meter${hi?' hi':''}"><div class="lab"><span>${label}</span><b>%${Math.round(p)}${stale?' · eski':''}</b></div><div class="bar"><span style="transform:scaleX(${p/100})"></span></div><div class="reset">${esc(until(w.resets))}</div></div>`;
}
function dayLabel(iso){ const d = new Date(iso+'T12:00:00'); return DAYS[d.getDay()]; }

const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.classList.add('show'); const x = Math.min(e.clientX+14, innerWidth - tip.offsetWidth - 8); tip.style.left = x+'px'; tip.style.top = (e.clientY+16)+'px'; }
function hideTip(){ tip.classList.remove('show'); }

function hourModels(p, di, h){
  const x = (p.hm || []).find(r => r[0] === di && r[1] === h);
  return x ? Object.entries(x[2]).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmt(v)}`).join('\n') : '';
}
const dUTC = (s) => new Date(s + 'T00:00:00Z');
const dKey = (d) => d.toISOString().slice(0, 10);
const dAdd = (s, n) => { const d = dUTC(s); d.setUTCDate(d.getUTCDate() + n); return dKey(d); };
const mList = (m) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmt(v)}`).join('\n');
function dayMap(p){
  const m = {};
  (p.days || []).forEach(x => m[x.d] = [x.tok, x.m]);
  (p.cal || []).forEach(x => m[x[0]] = [x[1], x[2]]);
  return m;
}
function calRange(people){
  const end = people.map(p => (p.days || []).slice(-1)[0]?.d).filter(Boolean).sort().pop() || dKey(new Date());
  if (PERIOD !== 'all') return [dAdd(end, 1 - ({w2:14,w3:21,m1:30})[PERIOD]), end];
  const first = people.flatMap(p => Object.entries(dayMap(p)).filter(e => e[1][0] > 0).map(e => e[0])).sort()[0] || end;
  const min = dAdd(end, -7 * 20 + 1);
  return [first < min ? first : min, end];
}
let RATE = { five: 0.196, week: 0.0545 };
const pct = (x) => '%' + (x < 10 ? x.toFixed(1).replace('.', ',') : Math.round(x));
const kOf = (p) => p.all.tok ? p.all.usd / p.all.tok : 0;
function hourHeat(p){
  const k = kOf(p);
  const days = p.days.slice(-7);
  const idx = PERIOD === 'today' ? [6] : PERIOD === 'yday' ? [5] : [0,1,2,3,4,5,6];
  const rows = idx.map(di => `<span class="dl">${dayLabel(days[di].d)}</span><div class="cells">${p.hours[di].map((v,h) => `<i style="background:${heatColor(v * k * RATE.five, 50)}" data-t="${esc(dayLabel(days[di].d))} ${String(h).padStart(2,'0')}:00" data-v="${v}" data-p="5 saatlik limit ≈${pct(v * k * RATE.five)} · haftalık ≈${pct(v * k * RATE.week)}" data-m="${esc(hourModels(p, di, h))}"></i>`).join('')}</div>`).join('');
  return `<div class="heat">${rows}<div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>`;
}
function calHeat(p, start, end){
  const k = kOf(p);
  const m = dayMap(p);
  const lead = (dUTC(start).getUTCDay() + 6) % 7;
  const first = dAdd(start, -lead);
  const n = Math.round((dUTC(end) - dUTC(first)) / 864e5) + 1;
  const weeks = Math.ceil(n / 7);
  let cells = '', months = '', last = -1;
  for (let i = 0; i < weeks * 7; i++) {
    const d = dAdd(first, i);
    if (i % 7 === 0) { const mo = +d.slice(5, 7) - 1; months += `<span>${mo !== last ? MONTHS[mo] : ''}</span>`; last = mo; }
    if (d < start || d > end) { cells += '<i class="x"></i>'; continue; }
    const [v, mm] = m[d] || [0, {}];
    const dt = dUTC(d);
    cells += `<i style="background:${heatColor(v * k * RATE.week, 10)}" data-p="haftalık limit ≈${pct(v * k * RATE.week)}" data-t="${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]} ${DAYS[dt.getUTCDay()]}" data-v="${v}" data-m="${esc(mList(mm))}"></i>`;
  }
  const size = `repeat(${weeks}, minmax(0, ${weeks > 30 ? 12 : weeks > 8 ? 16 : 20}px))`;
  return `<div class="cal"><div class="ml" style="grid-template-columns:${size}">${months}</div><div class="dls"><span>Pzt</span><span></span><span>Çar</span><span></span><span>Cum</span><span></span><span>Paz</span></div><div class="weeks" style="grid-template-columns:${size}">${cells}</div></div>`;
}
function fav(p){
  const e = Object.entries((p.all && p.all.m) || {}).sort((a, b) => b[1] - a[1])[0];
  return e ? e[0] : p.model;
}
function models(m, tot){
  const e = Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (!e.length) return '<span class="none">bu dönemde kullanım yok</span>';
  return e.map(([k, v]) => `<div><span>${esc(k)}</span><b>${fmt(v)}</b><span class="mbar"><i style="transform:scaleX(${tot ? v / tot : 0})"></i></span></div>`).join('');
}
function account(people){
  const p = people.filter(x => x.planAt).sort((a, b) => b.planAt - a.planAt)[0];
  const el = $('#acct');
  if (!p) { el.hidden = true; return; }
  const stale = Date.now() - p.planAt > 6*36e5;
  el.innerHTML = `<h2>Ortak hesap${p.plan ? ' · ' + esc(p.plan) : ''}<span>okuma ${ago(p.planAt)}</span></h2>${meter('5 saatlik limit', p.five, stale)}${meter('Haftalık, tüm modeller', p.week, stale)}${meter('Haftalık, Fable', p.weekFable, stale)}`;
  el.hidden = false;
}
function sumOf(p, per){
  if (per === 'all') return { tok: p.all.tok, usd: p.all.usd, m: p.all.m || {} };
  const d = p.days || [];
  const pick = per === 'today' ? d.slice(-1) : per === 'yday' ? d.slice(-2, -1) : d.slice(-({w1:7,w2:14,w3:21,m1:30})[per]);
  return pick.reduce((a, x) => { for (const [k, v] of Object.entries(x.m || {})) a.m[k] = (a.m[k] || 0) + v; a.tok += x.tok; a.usd += x.usd; return a; }, { tok: 0, usd: 0, m: {} });
}
const perName = () => (PERIODS.find(p => p[0] === PERIOD) || PERIODS[2])[1];
let TABS_BUILT = false, ANIM = false, CH = null, PLOT_ID = 0;
function tabs(){
  const nav = $('#tabs');
  if (!TABS_BUILT){
    nav.innerHTML = '<span class="ind"></span>' + PERIODS.map(([k, n]) => `<button type="button" data-p="${k}">${n}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.p === PERIOD) return;
      PERIOD = b.dataset.p; try { localStorage.setItem('kcs-p', PERIOD); } catch {}
      ANIM = true; tabs(); if (LAST) render(LAST);
    }));
    TABS_BUILT = true;
  }
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === PERIOD)));
  const on = nav.querySelector('button[aria-pressed="true"]'), ind = nav.querySelector('.ind');
  if (on && ind){
    ind.style.width = on.offsetWidth + 'px';
    ind.style.transform = `translateX(${on.offsetLeft}px)`;
    if (!ind.classList.contains('go')) requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.add('go')));
  }
}
addEventListener('resize', tabs);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(tabs);
let LAST = null;
function render(people){
  LAST = people;
  const doAnim = ANIM; ANIM = false;
  people.sort((a,b) => sumOf(b, PERIOD).tok - sumOf(a, PERIOD).tok || b.all.tok - a.all.tok);
  const live = $('#live');
  const newest = Math.max(...people.map(p => p.updated));
  live.innerHTML = `<div><span class="dot"></span>son rapor <b>${ago(newest)}</b></div><div>${people.length} kişi · ${people.length} bilgisayar</div>`;
  const board = $('#board');
  if (!people.length){
    board.innerHTML = `<div class="empty"><h3>Henüz kimse rapor vermedi</h3>Skill'i kuran ilk kişi on dakika içinde burada görünür. Hemen görmek için kendi bilgisayarında <code>node ~/.claude/together/together.js push</code> çalıştır.</div>`;
    return;
  }
  account(people);
  const groupTok = people.reduce((n, x) => n + sumOf(x, PERIOD).tok, 0);
  const hourly = ['today','yday','w1'].includes(PERIOD);
  const [cs, ce] = hourly ? [] : calRange(people);
  const rp = people.filter(p => p.rate && p.rate.week).sort((a, b) => b.updated - a.updated)[0];
  if (rp) RATE = { five: rp.rate.five || RATE.five, week: rp.rate.week };
  const anyUse = people.some(p => p.all.tok > 0);
  let html = `<div class="head"><span></span><span>Kim</span><span>${HEADS[PERIOD]}</span><span>${perName()} token</span><span>Tahmini</span><span>Modeller</span></div>`;
  people.forEach((p, i) => {
    const stale = p.planAt && Date.now() - p.planAt > 6*36e5;
    const sp = sumOf(p, PERIOD);
    html += `<article class="row${i===0?' first':''}">
      <div class="rank"></div>
      <div class="who"><div class="name"><span class="rk">${i+1}</span>${esc(p.name)}</div><div class="host">${esc(p.host)} · güncellendi ${ago(p.updated)}${fav(p) ? `<br>favori <span class="model">${esc(fav(p))}</span>` : ''}</div></div>
      ${hourly ? hourHeat(p) : calHeat(p, cs, ce)}
      <div class="num n7"><div class="big">${fmt(sp.tok)}</div><div class="sub">Used: <b class="lim">${groupTok ? Math.round(100 * sp.tok / groupTok) + '%' : '—'}</b><br>${PERIOD === 'today' ? 'toplam ' + fmt(p.all.tok) : 'bugün ' + fmt(p.today.tok)} token</div></div>
      <div class="num usd"><div class="big" style="font-size:22px">${usd(sp.usd)}</div><div class="sub">${PERIOD === 'all' ? perName() : 'toplam ' + usd(p.all.usd)}<br>haftalık <b class="lim">≈${pct(sp.usd * RATE.week)}</b>${PERIOD === 'today' ? `<br>5 saat <b class="lim">≈${pct(sp.usd * RATE.five)}</b>` : ''}</div></div>
      <div class="models">${models(sp.m, sp.tok)}</div>
    </article>`;
  });
  board.innerHTML = html;
  if (doAnim && board.animate) board.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
  board.querySelectorAll('.cells i, .weeks i:not(.x)').forEach(c => {
    c.addEventListener('mousemove', e => showTip(e, `${c.dataset.t} <span>·</span> ${fmt(+c.dataset.v)} token${+c.dataset.v ? '<br><span>' + c.dataset.p + '</span>' : ''}${c.dataset.m ? '<br><span>' + c.dataset.m.split('\n').map(esc).join('<br>') + '</span>' : ''}`));
    c.addEventListener('mouseleave', hideTip);
  });

  const byHour = PERIOD === 'today' || PERIOD === 'yday';
  let keys, labels, tips;
  if (byHour) {
    keys = [...Array(24).keys()];
    labels = keys.map(h => String(h).padStart(2, '0') + ':00');
    tips = labels;
  } else {
    const [a, b] = PERIOD === 'w1' ? [dAdd(people[0].days.slice(-1)[0].d, -6), people[0].days.slice(-1)[0].d] : [cs, ce];
    keys = []; for (let d = a; d <= b; d = dAdd(d, 1)) keys.push(d);
    labels = keys.map(d => `${d.slice(8)}.${d.slice(5,7)}`);
    tips = keys.map(d => { const t = dUTC(d); return `${t.getUTCDate()} ${MONTHS[t.getUTCMonth()]} ${DAYS[t.getUTCDay()]}`; });
  }
  const di = PERIOD === 'today' ? 6 : 5;
  const order = people.map(p => p.name).sort((a, b) => a.localeCompare(b, 'tr'));
  const series = people.map(p => {
    const m = dayMap(p);
    return { name: p.name, color: COLORS[order.indexOf(p.name) % COLORS.length], v: byHour ? keys.map(h => (p.hours[di] || [])[h] || 0) : keys.map(d => (m[d] || [0])[0]) };
  });
  $('#chartTitle').textContent = ({today:'Bugün', yday:'Dün', w1:'Son 7 gün', w2:'Son 14 gün', w3:'Son 21 gün', m1:'Son 30 gün', all:'Tüm zaman'})[PERIOD];
  const days = keys;
  $('#chart').hidden = false;
  const W = Math.max(300, Math.round($('#plot').clientWidth || 1200)), Hh = W < 600 ? 220 : 300, padL = 46, padB = 30, padT = 10;
  const top = Math.max(1000, ...series.flatMap(s => s.v));
  const step = (W - padL) / (days.length - 1);
  const y = v => padT + (Hh - padT - padB) * (1 - v/top);
  const ticks = [0, .25, .5, .75, 1].map(f => top*f);
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Token grafiği">`;
  ticks.forEach(t => svg += `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(244,237,230,.07)"/><text x="${padL-10}" y="${y(t)+4}" text-anchor="end" fill="#7d6f83" font-size="12" font-family="Host Grotesk">${fmt(Math.round(t))}</text>`);
  const every = Math.max(1, Math.ceil(days.length / (W < 600 ? 6 : 13))); days.forEach((d,i) => { if ((i%every===0 && days.length-1-i >= every*0.6) || i===days.length-1) svg += `<text x="${padL+i*step}" y="${Hh-8}" text-anchor="middle" fill="#7d6f83" font-size="12" font-family="Host Grotesk">${labels[i]}</text>`; });
  series.slice().reverse().forEach(s => {
    const pts = s.v.map((v,i) => `${padL+i*step},${y(v)}`).join(' ');
    svg += `<polyline data-n="${esc(s.name)}" points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.v.forEach((v,i) => svg += `<circle cx="${padL+i*step}" cy="${y(v)}" r="9" fill="transparent" data-n="${esc(s.name)}" data-d="${esc(tips[i])}" data-v="${v}"/>${days.length > 40 ? '' : `<circle cx="${padL+i*step}" cy="${y(v)}" r="2.6" fill="${s.color}" pointer-events="none"/>`}`);
  });
  svg += `</svg>`;
  const plot = $('#plot'), nPts = days.length, fin = {};
  series.forEach(s => fin[s.name] = s.v.map(v => y(v)));
  plot.innerHTML = svg;
  const id = ++PLOT_ID;
  if (doAnim && CH && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    const resamp = (a, n) => !a ? Array(n).fill(y(0)) : a.length === 1 ? Array(n).fill(a[0]) : Array.from({ length: n }, (_, i) => { const q = i / (n - 1) * (a.length - 1), k = Math.floor(q); return a[k] + (a[Math.min(k + 1, a.length - 1)] - a[k]) * (q - k); });
    const polys = [...plot.querySelectorAll('polyline')], from = polys.map(pl => resamp(CH[pl.dataset.n], nPts));
    const draw = e => polys.forEach((pl, j) => pl.setAttribute('points', fin[pl.dataset.n].map((yy, i) => `${padL + i * step},${from[j][i] + (yy - from[j][i]) * e}`).join(' ')));
    plot.classList.add('morph'); draw(0);
    const t0 = performance.now();
    const tick = now => {
      if (id !== PLOT_ID) return;
      const t = Math.min(1, (now - t0) / 560);
      draw(1 - Math.pow(1 - t, 3));
      if (t < 1) requestAnimationFrame(tick); else plot.classList.remove('morph');
    };
    requestAnimationFrame(tick);
  }
  CH = fin;
  $('#legend').innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  $('#plot').querySelectorAll('circle[data-n]').forEach(c => {
    c.addEventListener('mousemove', e => showTip(e, `${c.dataset.n} <span>·</span> ${c.dataset.d} <span>·</span> ${fmt(+c.dataset.v)} token`));
    c.addEventListener('mouseleave', hideTip);
  });
  $('#chart').hidden = false;

  const hIdx = PERIOD === 'today' ? [6] : PERIOD === 'yday' ? [5] : [0,1,2,3,4,5,6];
  const hs = Array(24).fill(0); people.forEach(p => hIdx.forEach(di => (p.hours[di] || []).forEach((v,h) => hs[h] += v)));
  const hTop = Math.max(...hs), hot = hs.indexOf(hTop);
  const [ds, de] = hourly ? [people[0].days.slice(-7)[0].d, people[0].days.slice(-1)[0].d] : [cs, ce];
  const dt = {}; people.forEach(p => Object.entries(dayMap(p)).forEach(([d, x]) => { if (d >= ds && d <= de) dt[d] = (dt[d] || 0) + x[0]; }));
  const hd = Object.entries(dt).sort((a, b) => b[1] - a[1])[0];
  const dl = hd && hd[1] ? (() => { const d = dUTC(hd[0]); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${DAYS[d.getUTCDay()]}`; })() : '';
  const hourPart = !hourly || !hTop ? '' : `En yoğun saat <b>${String(hot).padStart(2,'0')}:00</b>`;
  const dayPart = ['today','yday'].includes(PERIOD) || !dl ? '' : `en yoğun gün <b>${dl}</b>`;
  const line = [hourPart, dayPart].filter(Boolean).join(', ');
  $('#totals').innerHTML = line ? line.charAt(0).toUpperCase() + line.slice(1) + '.' : 'Bu dönemde kullanım yok.';
  $('#totals').hidden = false;
}

function fail(title, text){
  $('#board').innerHTML = `<div class="err"><h3>${title}</h3>${text}</div>`;
}

let KEY = null;
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
async function comments(){
  try {
    const d = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data.json?t=${Math.floor(Date.now() / 60000)}`);
    if (d.ok) { const list = await d.json(); store.set('kcs-c', { list, at: Date.now() }); return { list, ok: true }; }
  } catch {}
  const cached = store.get('kcs-c');
  const headers = { Accept: 'application/vnd.github+json' };
  if (cached && cached.etag) headers['If-None-Match'] = cached.etag;
  let r = null;
  try { r = await fetch(`https://api.github.com/repos/${REPO}/issues/${ISSUE}/comments?per_page=100`, { headers }); } catch {}
  if (r && r.status === 304 && cached) return { list: cached.list, ok: true };
  if (r && r.ok) {
    const list = (await r.json()).map(c => ({ body: c.body }));
    store.set('kcs-c', { etag: r.headers.get('ETag'), list, at: Date.now() });
    return { list, ok: true };
  }
  return { list: cached ? cached.list : null, ok: false, limited: r && (r.status === 403 || r.status === 429), offline: !r };
}
async function people(list){
  const byId = new Map();
  let total = 0;
  for (const c of list) {
    const m = /^together:v1:([0-9a-f]+):(.+)$/s.exec(c.body || '');
    if (!m) continue;
    total++;
    try { const d = await unseal(KEY, m[2].trim()); if (!d || typeof d !== 'object') continue; if (!byId.has(m[1]) || byId.get(m[1]).updated < d.updated) byId.set(m[1], d); } catch {}
  }
  return { list: [...byId.values()], total };
}
async function load(first){
  const got = await comments();
  if (!got.list) {
    if (first) return false;
    return fail(got.limited ? 'GitHub şimdilik yavaşlattı' : 'Bağlantı yok', got.limited ? 'Saatlik okuma sınırı doldu. Sayfa birkaç dakika içinde kendi kendine tekrar dener.' : 'İnternet bağlantısı gelince sayfa kendi kendine yenilenecek.');
  }
  const p = await people(got.list);
  if (first && p.total && !p.list.length) return 'badkey';
  render(p.list);
  return true;
}

addEventListener('hashchange', () => { if (/k=/.test(location.hash)) location.reload(); });
(async () => {
  const k = keyText();
  if (!k) return;
  try{
    KEY = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt']);
  }catch{ return; }
  document.title = 'kim claude sikiyor';
  document.body.classList.add('on');
  tabs();
  const res = await load(true);
  if (res === 'badkey') { try{ localStorage.removeItem('kcs-k'); }catch{} document.body.classList.remove('on'); document.title = '​'; return; }
  if (res === false) fail('GitHub şimdilik yavaşlattı', 'Saatlik okuma sınırı doldu. Sayfa birkaç dakika içinde kendi kendine tekrar dener.');
  setInterval(() => load(false), 300000);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => LAST && render(LAST), 200); });
})();
