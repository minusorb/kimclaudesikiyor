name: board
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh api "repos/${{ github.repository }}/issues/1/comments?per_page=100" --jq '[.[] | {body}]' > data.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name minusorb
          git config user.email 164383298+minusorb@users.noreply.github.com
          git add data.json
          git diff --cached --quiet || { git commit -q --allow-empty-message -m "" && git push -q; }
